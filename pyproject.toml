[project]
name = "com-agent-runtime"
version = "0.1.0"
description = "情侣日记后端"
authors = [
    {name = "yuye",email = "18838280615@163.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.103.0",
    "uvicorn>=0.23.2",
    "sqlalchemy>=2.0.20",
    "alembic>=1.12.0",
    "mysql-connector-python>=8.1.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.3.0",
    "pydantic-settings>=2.0.3",
    "httpx>=0.25.0",
    # 私有回忆录媒体使用 S3 兼容对象存储的短期 get_object 签名 URL。
    "boto3>=1.35.0",
    "redis>=5.0.0",
    "cachetools>=5.3.0",
    "loguru>=0.7.0",
    "click>=8.0.0",
    # 回忆录快照必须使用经过认证的加密算法保存，禁止自行实现加密。
    "cryptography>=43.0.0",
    # AgentPackage 使用 YAML 描述可信工作流、工具与策略清单。
    "PyYAML>=6.0.0",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0,<9.0.0"
pytest-asyncio = ">=0.24.0,<1.0.0"
ruff = ">=0.6.0,<1.0.0"
pre-commit = ">=3.8.0,<4.0.0"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Runtime ORM 与中文安全审计日志包含较长的领域字段名，保留完整语义优先于强制换行。
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
