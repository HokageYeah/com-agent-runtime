agent_id: qa_agent
version: 1.0.0
contract_version: 1.0.0
status: active
allowed_business_types:
  - business_qa
policy:
  waiting_human_timeout_action: failed
  # 四个节点无循环；额外额度只供受控传输重试，不提供模板回答。
  max_model_calls: 2
  max_tokens: 12000
  max_model_cost: 0.1
  max_steps: 8
  max_tool_calls: 6
  max_run_seconds: 120
  max_auto_retry_per_step: 1
prompts:
  - compose-answer.v1.md
