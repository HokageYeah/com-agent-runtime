# 逻辑策略仅映射部署可信 route；业务请求、prompt 和模型输出不能覆盖此配置。
reasoning:
  max_output_tokens: 2048
  required_capabilities: [structured_output]
  thinking_enabled: true
  requires_vision: false
  fallback: template
balanced:
  max_output_tokens: 1024
  required_capabilities: [structured_output]
  thinking_enabled: false
  requires_vision: false
  fallback: template
emotional_writing:
  max_output_tokens: 1024
  required_capabilities: [structured_output]
  thinking_enabled: false
  requires_vision: false
  fallback: template
cheap_structured:
  max_output_tokens: 512
  required_capabilities: [structured_output]
  thinking_enabled: false
  requires_vision: false
  fallback: template
strict:
  max_output_tokens: 512
  required_capabilities: [structured_output]
  thinking_enabled: false
  requires_vision: false
  fallback: template
private_first:
  max_output_tokens: 512
  required_capabilities: [structured_output, private_residency]
  thinking_enabled: false
  requires_vision: false
  fallback: template
# 仅脱敏数据护栏：模型请求只携带 prompt 模板与素材引用 ID 占位符，
# 不含日记/赌约正文与摘要，因此允许走公有 Provider（如 DeepSeek）。
redacted_only:
  max_output_tokens: 512
  required_capabilities: [structured_output]
  thinking_enabled: false
  requires_vision: false
  fallback: template
