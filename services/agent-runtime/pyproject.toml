[project]
name = "agent-runtime"
version = "0.1.0"
description = "Standalone public AgentRuntime service"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.103.0",
    "uvicorn>=0.23.2",
    "pydantic-settings>=2.0.3",
    "sqlalchemy>=2.0.20",
    "alembic>=1.12.0",
    "httpx>=0.25.0",
    # AgentPackage 以 YAML 保存受信任工作流与策略清单。
    "PyYAML>=6.0.0",
    # Checkpoint 保存可恢复私密状态时使用认证加密，禁止自行实现密码算法。
    "cryptography>=43.0.0",
]

[project.scripts]
agent-runtime-worker = "app.worker:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Runtime 数据模型字段名较长，格式化器已保证可读性；不强制拆分每个 ORM 声明。
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0,<9.0.0"
ruff = ">=0.6.0,<1.0.0"
mypy = ">=1.13.0,<2.0.0"
types-PyYAML = ">=6.0.12"
