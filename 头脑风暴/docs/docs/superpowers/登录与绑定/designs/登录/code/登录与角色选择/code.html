<style>
        @keyframes soft-breath {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 rgba(255, 143, 163, 0); }
            50% { transform: scale(1.05); box-shadow: 0 0 20px rgba(255, 143, 163, 0.2); }
        }
        @keyframes floating-heart {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
        .animate-breath {
            animation: soft-breath 3s ease-in-out infinite;
        }
        .role-selected {
            border: 3px solid #ff8fa3 !important;
            background-color: #fff0f1 !important;
            transform: scale(1.05);
        }
        .role-selected .role-text {
            color: #ff8fa3 !important;
            font-weight: 700;
        }
        .heart-particle {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            color: #ff8fa3;
            opacity: 0;
        }
        .glass-panel {
            background: rgba(255, 248, 247, 0.7);

<script>
        function selectRole(role) {
            const he = document.getElementById('role-he');
            const she = document.getElementById('role-she');
            
            if (role === 'he') {
                he.classList.add('role-selected');
                she.classList.remove('role-selected');
            } else {
                she.classList.add('role-selected');
                he.classList.remove('role-selected');
            }

            // Haptic feedback simulation
            if (window.navigator.vibrate) {
                window.navigator.vibrate(10);
            }
        }

        // Heart Background Animation
        function createHeart() {
            const container = document.getElementById('heart-container');
            const heart = document.createElement('span');
            heart.classList.add('material-symbols-outlined', 'heart-particle');
            heart.style.fontVariationSettings = "'FILL' 1";
            heart.innerText = 'favorite';
            
            const size = Math.random() * 20 + 10 + 'px';
            heart.style.fontSize = size;
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.bottom = '-50px';
            
            const duration = Math.random() * 10 + 5 + 's';
            heart.style.animation = `floating-heart ${duration} linear forwards`;
            
            container.appendChild(heart);
            
            setTimeout(() => {
                heart.remove();
            }, parseFloat(duration) * 1000);
        }

        setInterval(createHeart, 800);
    </script>
