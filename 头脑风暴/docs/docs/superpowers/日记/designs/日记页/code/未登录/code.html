<style>
        body {
            background-color: #fff8f7; /* Warm Skin White */
            color: #22191a;
            overflow-x: hidden;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .diary-line {
            background-image: radial-gradient(#dac0c3 1.5px, transparent 1.5px);
            background-size: 8px 8px;
        }
        .floating {
            animation: floating 4s ease-in-out infinite;
        }
        @keyframes floating {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .blur-gradient {
            background: radial-gradient(circle at 50% 50%, rgba(255, 143, 163, 0.15) 0%, rgba(255, 248, 247, 0) 70%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="font-body-md text-body-md min-h-screen flex flex-col">
<!-- Top AppBar -->
<header class="bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-md docked full-width top-0 z-50 flex justify-between items-center px-container-padding h-16 w-full fixed">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim">calendar_today</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary dark:text-primary-fixed-dim">情侣日记</h1>
</div>
<button class="active:scale-95 transition-transform hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim">favorite</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-20 pb-32 px-container-padding flex flex-col items-center relative overflow-hidden">
<!-- Background Atmosphere -->
<div class="absolute inset-0 z-0 pointer-events-none">
<div class="blur-gradient w-full h-full absolute top-[-10%] left-[-10%]"></div>
<div class="blur-gradient w-full h-full absolute bottom-[-10%] right-[-10%]"></div>
<div class="petal w-4 h-4" style="left: 10%; animation-duration: 8s; animation-delay: 0s;"></div><div class="petal w-3 h-3" style="left: 30%; animation-duration: 12s; animation-delay: -2s;"></div><div class="petal w-5 h-5" style="left: 70%; animation-duration: 10s; animation-delay: -5s;"></div><div class="petal w-4 h-4" style="left: 90%; animation-duration: 15s; animation-delay: -1s;"></div></div>
<!-- Top Area: Illustration & Headlines -->
<div class="relative z-10 flex flex-col items-center text-center mt-4 mb-8">
<div class="w-48 h-48 mb-6 floating relative">
<div class="absolute inset-0 bg-primary-container/20 rounded-full blur-xl scale-125"></div>
<img alt="Romantic Illustration" class="w-full h-full object-contain relative z-10" data-alt="A soft, hand-drawn style illustration of a couple's diary with cherry blossom petals gently falling around it. The art style is warm and tactile, featuring soft pastel pinks and creams. The lighting is warm and golden, like a sunset filtering through a window, creating a cozy and nostalgic atmosphere that invites intimacy and storytelling." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBqo90R5K-1NIokaBqWt0rRLx7-AL25zUSvLkU7F-bAbhc_OEM6-YW4C1eGyOATTLR-Eq_ci9zLBfM0nJgLLNucgRrorVpMaBbndyZnFiPm0feon-NsAACd1_5iHz46_6Oo28JgZu2OfhZOLHrsX8aLDQ-NuLKmQYdJ1cuIhWEcKmfjgscMVPpWuPGH54XTeXNKsjFOHfBfb7nRx2knOWVhQijwco4KmM1dlGZ_g0B0bqoenpqn-8-yA8IoRJdg4PR5-eYDqohwQHI">
</div>
<h2 class="font-headline-lg text-headline-lg text-primary mb-2">开启你们的记录</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[280px]">在这里，记录属于你们的每一个心动时刻</p>
</div>
<!-- Main Card: Login & Preview -->
<div class="w-full max-w-md bg-white rounded-3xl p-lg shadow-[0_16px_32px_rgba(34,25,26,0.08)] border border-[#F2E8DF] relative z-10">
<!-- CTA Button -->
<button class="w-full bg-[#9c4b57] text-white font-title-md text-title-md py-4 px-lg rounded-full shadow-lg hover:opacity-90 active:scale-95 transition-all flex items-center justify-center gap-2 mb-8 animate-pulse">
<span class="material-symbols-outlined">login</span>
                登录 / 注册
            </button>
<div class="text-center mb-6">
<p class="font-label-md text-label-md text-outline">登录后即可查看与 TA 的共享日记</p>
</div>
<!-- Ghost Timeline Preview -->
<div class="relative w-full py-8">
<!-- Central Axis Line -->
<div class="absolute left-1/2 top-0 bottom-0 w-[1px] border-l border-dotted border-[#e7d6d7] -translate-x-1/2"></div>
<!-- Left Card (Partner) -->
<div class="relative flex justify-start mb-12">
<div class="w-[45%] rounded-3xl p-4 border shadow-sm relative bg-white border-[#F2E8DF]">

<p class="text-[12px] text-[#8c7b7c] mb-1">2026.06.10</p>
<p class="text-[14px] text-[#4a3a3b] font-medium">今天去看了超浪漫的日落，和你在一起的时间总是过得很快...</p>
</div>
</div>
<!-- Central Heart Node -->
<div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-md z-20 border-2 border-[#ffd9dd]">
<span class="material-symbols-outlined text-[#ff8fa3]" style="font-variation-settings: 'FILL' 1;">favorite</span>
</div>
<!-- Right Card (Self) -->
<div class="relative flex justify-end mt-4">
<div class="w-[45%] bg-white rounded-3xl p-4 border border-[#F2E8DF] shadow-[0_8px_24px_rgba(255,143,163,0.08)] relative">
<p class="text-[12px] text-[#8c7b7c] mb-1">刚刚</p>
<p class="text-[14px] text-[#4a3a3b] font-medium">记得那时候...</p>
</div>
</div>
</div>
<!-- Decorative Squiggle Divider -->
<div class="mt-8 flex justify-center opacity-30">
<svg fill="none" height="10" viewBox="0 0 100 10" width="100" xmlns="http://www.w3.org/2000/svg">
<path d="M0 5C10 5 15 1 25 1C35 1 40 9 50 9C60 9 65 1 75 1C85 1 90 5 100 5" stroke="#9b4053" stroke-linecap="round" stroke-width="2"></path>
</svg>
</div>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-gutter py-3 pb-safe bg-surface dark:bg-surface-dim shadow-[0_-4px_16px_rgba(34,25,26,0.08)] rounded-t-xl">
<!-- Diary (Active) -->
<a class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary text-on-primary-container dark:text-on-primary rounded-full px-5 py-1 active:scale-90 transition-all duration-200 ease-out" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">auto_stories</span>
<span class="font-label-md text-label-md">日记</span>
</a>
<!-- Stakes -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline px-5 py-1 hover:bg-surface-variant/50 dark:hover:bg-surface-variant/20 rounded-full active:scale-90 transition-all duration-200 ease-out" href="#">
<span class="material-symbols-outlined">casino</span>
<span class="font-label-md text-label-md">赌局</span>
</a>
<!-- My Profile -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline px-5 py-1 hover:bg-surface-variant/50 dark:hover:bg-surface-variant/20 rounded-full active:scale-90 transition-all duration-200 ease-out" href="#">
<span class="material-symbols-outlined">person</span>
<span class="font-label-md text-label-md">我的</span>
</a>
</nav>
<script>
        // Simple micro-interaction for the CTA button
        const ctaBtn = document.querySelector('button');
        ctaBtn.addEventListener('mousedown', () => {
            ctaBtn.classList.add('scale-95');
        });
        ctaBtn.addEventListener('mouseup', () => {
            ctaBtn.classList.remove('scale-95');
        });
        ctaBtn.addEventListener('mouseleave', () => {
            ctaBtn.classList.remove('scale-95');
        });
    </script>




</body></html>
