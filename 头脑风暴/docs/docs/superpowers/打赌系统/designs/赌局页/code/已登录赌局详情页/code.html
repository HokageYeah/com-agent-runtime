<script>
        function selectChoice(el, type) {
            // Remove selection from others
            document.querySelectorAll('.choice-card').forEach(card => {
                card.classList.remove('choice-selected');
            });

            // Add selection to clicked
            el.classList.add('choice-selected');

            // Trigger burst animation if it's a win
            if (type === 'girl' || type === 'boy') {
                createHeartBurst(el);
            }
        }

        function createHeartBurst(parent) {
            const rect = parent.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            for (let i = 0; i < 8; i++) {
                const heart = document.createElement('span');
                heart.className = 'material-symbols-outlined heart-particle text-primary';
                heart.innerHTML = 'favorite';
                heart.style.fontVariationSettings = "'FILL' 1";
                heart.style.left = `${centerX}px`;
                heart.style.top = `${centerY}px`;

                const angle = (i * 45) * (Math.PI / 180);
                const velocity = 50 + Math.random() * 50;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;

                heart.animate([
                    { transform: 'translate(-50%, -50%) scale(0)', opacity: 1 },
                    { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(1.5)`, opacity: 0 }
                ], {
                    duration: 600 + Math.random() * 400,
                    easing: 'cubic-bezier(0, .9, .57, 1)',
                    fill: 'forwards'
                });

                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 1000);
            }
        }

        // micro-interaction for submit button
        document.getElementById('submitBtn').addEventListener('click', function() {
            const selected = document.querySelector('.choice-selected');
            if (!selected) {
                alert('请先选择一个胜负结果哦～');
                return;
            }

            this.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="sync">sync</span> 提交中...';
            setTimeout(() => {
                this.innerHTML = '提交成功！✨';
                this.classList.replace('bg-primary', 'bg-tertiary-container');
                this.classList.replace('text-on-primary', 'text-on-tertiary-container');
            }, 1200);
        });
    </script>


<script>
    (function() {
        const targetDate = new Date('2026-06-12T23:30:00').getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                document.getElementById('countdown-timer').innerHTML = '<span class="text-primary">已截止</span>';
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = String(days).padStart(2, '0');
            document.getElementById('hours').innerText = String(hours).padStart(2, '0');
            document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
            document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    })();
