<style>
        body { background-color: #fff8f7; }
        .memory-card {
            box-shadow: 0 8px 24px -4px rgba(255, 143, 163, 0.12);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .memory-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px -4px rgba(255, 143, 163, 0.2);
        }
        .stagger-in {
            animation: staggerUp 0.6s ease-out forwards;
            opacity: 0;
        }
        @keyframes staggerUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .glass-nav {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #dac0c3; border-radius: 10px; }

<style>
    body {

<body class="font-body-md text-on-surface antialiased">
<!-- Top AppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 glass-nav shadow-sm h-16 flex justify-between items-center px-container-padding">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-2xl">arrow_back</span>

</button>
</div>
</header>
<main class="pt-20 px-container-padding max-w-2xl mx-auto">
<!-- Search & Filters -->

<input class="w-full bg-surface-container-low border-none rounded-full py-3 px-12 text-on-surface-variant focus:ring-2 focus:ring-primary/20 placeholder:text-outline-variant transition-all" placeholder="搜索珍贵的回忆..." type="text"/>
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">search</span>

<span class="material-symbols-outlined text-primary text-[16px]" style="font-variation-settings: 'FILL' 1;">favorite</span>
</div>
</div>
<div>
<h3 class="font-title-md text-title-md text-on-surface">林小月</h3>
<p class="font-caption text-caption text-outline">相遇至今：521天</p>
</div>
</div>
<button class="text-outline-variant hover:text-primary transition-colors p-1">
<span class="material-symbols-outlined">more_vert</span>
</button>
</div>
<div class="mt-md grid grid-cols-2 gap-md">
<div class="bg-primary-container/5 rounded-xl p-3 text-center border border-primary-container/10">

<!-- Empty State Illustration Placeholder / Bottom Spacer -->
<div class="mt-xl text-center py-lg opacity-40">
<span class="material-symbols-outlined text-primary text-4xl block mb-2">auto_stories</span>
<p class="font-caption text-caption">到底啦，所有的爱都在这里了</p>
</div>
</main>
<!-- FAB -->
<!-- Bottom Navigation Bar -->
<script>
        // Micro-interaction for memory cards
        document.querySelectorAll('.memory-card').forEach(card => {
            card.addEventListener('touchstart', function() {
                this.style.transform = 'scale(0.98)';
            });
            card.addEventListener('touchend', function() {
                this.style.transform = 'scale(1)';
            });
        });

        // Simple filter button active state toggle
        const filterBtns = document.querySelectorAll('button.whitespace-nowrap');
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => {
                    b.classList.remove('bg-primary', 'text-white', 'shadow-md');
                    b.classList.add('bg-white', 'text-on-surface-variant', 'border', 'border-outline-variant/30');
                });
                btn.classList.add('bg-primary', 'text-white', 'shadow-md');
                btn.classList.remove('bg-white', 'text-on-surface-variant', 'border', 'border-outline-variant/30');
            });
        });
    </script>
</body></html>
