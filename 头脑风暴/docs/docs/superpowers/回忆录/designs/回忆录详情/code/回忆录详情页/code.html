<style>
        body {
            background-color: #fff8f7;
            margin: 0;

        .material-symbols-outlined {

            transform: scale(0.9);
            filter: blur(2px);
        }

        .flashback-card.active {
            opacity: 1;
            transform: scale(1);
            filter: blur(0);
        }

        .scroll-container {
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            -ms-overflow-style: none;
            display: flex;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-behavior: smooth;
        }
        .scroll-container::-webkit-scrollbar {
            display: none;
        }
        .snap-center {
            scroll-snap-align: center;
        }

        .heart-particle {
            position: absolute;
            pointer-events: none;
            animation: float-up 6s linear infinite;
            z-index: 5;
        }

        @keyframes float-up {
            0% {
                transform: translateY(105vh) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.6; }
            90% { opacity: 0.4; }
            100% {
                transform: translateY(-10vh) translateX(20px) rotate(45deg);
                opacity: 0;
            }
        }

        .gradient-mesh {
            background: radial-gradient(at 0% 0%, rgba(255, 143, 163, 0.2) 0, transparent 50%),
                        radial-gradient(at 100% 0%, rgba(166, 226, 255, 0.2) 0, transparent 50%),
                        radial-gradient(at 50% 100%, rgba(255, 218, 223, 0.3) 0, transparent 50%);
        }

        .progress-bar-segment {
            height: 3px;
            background: rgba(84, 66, 68, 0.15);
            flex: 1;
            border-radius: 99px;
            overflow: hidden;
            margin: 0 3px;
        }

        .progress-bar-fill {
            height: 100%;
            background: #9b4053;
            width: 0%;
            transition: width 0.1s linear;
        }

        .summary-card {
            box-shadow: 0 0 40px rgba(155, 64, 83, 0.3);
            animation: slow-entrance 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes slow-entrance {
            0% { transform: translateY(40px) scale(0.95); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        .card-entrance-pop {
            animation: pop-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes pop-in {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }

<script>
        // --- 1. Ambient Background: Floating Hearts ---
        function createParticles() {
            const container = document.getElementById('particles-container');
            const particleCount = 20;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'heart-particle';
                particle.innerHTML = `<span class="material-symbols-outlined text-primary/10" style="font-size: ${Math.random() * 15 + 10}px; font-variation-settings: 'FILL' 1;">favorite</span>`;

                // Randomize position and timing
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = Math.random() * 4 + 5 + 's';

                container.appendChild(particle);
            }
        }

        // --- 2. Carousel Logic & Transitions ---
        const container = document.getElementById('carousel-container');
        const cards = document.querySelectorAll('.flashback-card');
        const fills = document.querySelectorAll('.progress-bar-fill');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        let currentIndex = 0;

        function updateCarousel() {
            const width = container.clientWidth;

            cards.forEach((card, idx) => {
                // Update active state for scale/fade transition
                if (idx === currentIndex) {
                    card.classList.add('active');
                    // Add pop-in effect only when moving forward
                    card.classList.add('card-entrance-pop');
                } else {
                    card.classList.remove('active');
                    card.classList.remove('card-entrance-pop');
                }

                // Update Progress Bar Segments
                const fill = document.getElementById(`fill-${idx}`);
                if (idx < currentIndex) {
                    fill.style.width = '100%';
                } else if (idx === currentIndex) {
                    fill.style.width = '100%'; // Full in this view context
                    fill.style.transition = 'width 0.4s ease-out';
                } else {
                    fill.style.width = '0%';
                }
            });
        }

        // Scroll Event Listener for Manual Swiping
        let isScrolling;
        container.addEventListener('scroll', () => {
            window.clearTimeout(isScrolling);
            isScrolling = setTimeout(() => {
                const index = Math.round(container.scrollLeft / container.clientWidth);
                if (index !== currentIndex) {
                    currentIndex = index;
                    updateCarousel();
                }
            }, 50);
        });

        // Desktop Nav Buttons
        if (prevBtn && nextBtn) {
            prevBtn.addEventListener('click', () => {
                if (currentIndex > 0) {
                    currentIndex--;
                    container.scrollTo({ left: currentIndex * container.clientWidth, behavior: 'smooth' });
                }
            });
            nextBtn.addEventListener('click', () => {
                if (currentIndex < cards.length - 1) {
                    currentIndex++;
                    container.scrollTo({ left: currentIndex * container.clientWidth, behavior: 'smooth' });
                }
            });
        }

        // --- 3. Initial Setup ---
        window.addEventListener('DOMContentLoaded', () => {
            createParticles();
            updateCarousel(); // Initial state

            // Hint animation
            setTimeout(() => {
                container.scrollTo({ left: 30, behavior: 'smooth' });
                setTimeout(() => {
                    container.scrollTo({ left: 0, behavior: 'smooth' });
                }, 500);
            }, 1000);
        });
    </script>
